<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Overlay Cards</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .category-card {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      height: 260px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .category-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      transition: transform 0.5s ease;
    }

    /* Overlay (hidden by default) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.4s ease;
      border-radius: 15px;
    }

    /* Hover effect */
    .category-card:hover .overlay {
      opacity: 1;
    }

    .category-card:hover img {
      transform: scale(1.1);
    }

    /* White box inside overlay */
    .overlay .content-box {
      border: 2px solid rgba(255, 255, 255, 0.7);
      padding: 20px 25px;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.4s ease;
    }

    /* Show text box on hover */
    .category-card:hover .overlay .content-box {
      opacity: 1;
      transform: scale(1);
    }

    /* Responsive fix */
    @media (max-width: 768px) {
      .category-card {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="row g-4 justify-content-center">

      <div class="col-md-3 col-sm-6">
        <div class="category-card">
          <img src="images/aboutba.jpeg" alt="Accessories">
          <div class="overlay">
            <div class="content-box"></div>
          </div>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1581092335407-42b6b6d222c0" alt="Allied">
          <div class="overlay">
            <div class="content-box">Allied Products & Services</div>
          </div>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1562184552-4543b6bcb0e0" alt="Attaching">
          <div class="overlay">
            <div class="content-box">Attaching Machines</div>
          </div>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1581091012184-7e0cdfbb6795" alt="Automation">
          <div class="overlay">
            <div class="content-box">Automation Technologies</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

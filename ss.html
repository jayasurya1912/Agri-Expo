<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popup Contact Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
   
  </style>
</head>
<body>

<!-- CONTACT FORM POPUP MODAL -->
<div class="modal fade" id="contactPopup" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content contact-popup-content">

      <!-- Close Button -->
      <button type="button" class="popup-close-btn" data-bs-dismiss="modal">
        &times;
      </button>

      <div class="row g-0">
        <!-- Left Image -->
        <div class="col-md-6">
          <img src="images/efours.jpg" class="img-fluid h-100 w-100" style="object-fit: cover;" />
        </div>

        <!-- Right Form -->
        <div class="col-md-6 p-4">
          <h3 class="fw-bold text-white mb-3">Send Us a Message</h3>
          <p class="text-white">Have a project in mind or need expert advice? Fill out the form below and we’ll get back to you within 24 hours.</p>

          <form id="contactForm">
            <div class="mb-3">
              <label class="form-label text-white">Full Name</label>
              <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
            </div>

            <div class="mb-3">
              <label class="form-label text-white">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="Email" required>
            </div>

            <div class="mb-3">
              <label class="form-label text-white">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required>
            </div>

            <div class="mb-3">
              <label class="form-label text-white">Message</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Message" required></textarea>
            </div>

            <button type="submit" class="btn submit-btn" style="background-color: white; color: #218838;">Submit</button>

            <div class="privacy-note text-center text-white mt-2">
              We respect your privacy. Your information is safe with us and will never be shared.
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto-open popup after 3 seconds -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(() => {
      var myModal = new bootstrap.Modal(document.getElementById('contactPopup'));
      myModal.show();
    }, 3000);
  });
</script>

</body>
</html>
